<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>remote-controll - Tokens</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1><a href="/">&larr; Conversas</a></h1>
    <button id="logout" class="icon-btn" title="Sair" aria-label="Sair">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <main class="page">
    <p>Cole o token gerado aqui na configuração do vide-code para conectar.</p>
    <div id="new-token"></div>
    <form id="create-form">
      <input id="label-input" type="text" placeholder="Nome (ex: notebook)" />
      <button type="submit">Gerar token</button>
    </form>
    <ul id="token-list" class="session-list"></ul>
  </main>
  <script src="/tokens.js"></script>
</body>
</html>
